[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-ksp"
version = "2.0.0"
description = "Mission control for Kerbal Space Program 1: an AI flies the whole mission live through tools — it designs, builds, launches and pilots the rocket, computing every decision from telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shoal-rat" }]
dependencies = [
  "krpc==0.5.4",
  "mcp>=2.2",
  "pydantic>=2",
  "pillow>=10",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.150"]
media = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
astra = "astra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astra = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
