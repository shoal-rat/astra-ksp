// MechJeb for all command parts: adds a MechJebCore to every part with ModuleCommand, so the bridge's
// /mj-* endpoints work on any craft (vessel.GetMasterMechJeb() is null without a core on board).
//
// Needs ModuleManager. Install next to the bridge DLL as GameData/KspAutomationBridge/MechJebForAll.cfg
// (`astra bridge install` copies it). ModuleManager patches part prefabs at load, so vessels already in
// a save gain the core after KSP restarts.
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[MechJebCore]]:FINAL
{
	MODULE
	{
		name = MechJebCore
	}
}
